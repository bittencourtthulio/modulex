<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="Essencial e herdado: um teste separa o que viaja com o módulo do que é convenção da casa de origem e tem de ser traduzido pelo stackx do destino.">
<title>Essencial × herdado: o teste que impede a casa de origem de entrar na casa de destino</title>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.mut{fill:#8b949e}.dim{fill:#6e7681}.br{fill:#e6edf3}
@keyframes src{0%{fill:#6e7681}2%{fill:#e6edf3}10%{fill:#e6edf3}13%{fill:#8b949e}92%{fill:#8b949e}96%,100%{fill:#6e7681}}
@keyframes land{0%{opacity:0;transform:translateX(-10px)}2%{opacity:0}6%{opacity:1;transform:none}92%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes probe{0%{opacity:0}1%{opacity:1}5%{opacity:1}7%,100%{opacity:0}}
@keyframes testpulse{0%,100%{stroke:#30363d}2%,10%{stroke:#1f6feb}}
@keyframes wall{0%,100%{opacity:.35}40%,80%{opacity:1}}
.sr{animation-name:src;animation-duration:15s;animation-timing-function:ease-out;animation-iteration-count:infinite}
.ld{opacity:0;animation-name:land;animation-duration:15s;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-iteration-count:infinite}
.pb{opacity:0;animation-name:probe;animation-duration:15s;animation-timing-function:linear;animation-iteration-count:infinite}
</style>
<defs>
  <marker id="e-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#30363d"/></marker>
  <marker id="e-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#3fb950"/></marker>
  <marker id="e-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#d29922"/></marker>
</defs>

<rect x="0.5" y="0.5" width="999" height="439" rx="16" fill="#0d1117" stroke="#30363d"/>
<text class="s br" x="36" y="38" font-size="15" font-weight="700">Um teste, e só um, decide o que viaja com o módulo</text>
<text class="s dim" x="964" y="38" text-anchor="end" font-size="13">o maior risco da skill inteira</text>

<!-- origem -->
<rect x="36" y="70" width="270" height="300" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="m" x="56" y="96" font-size="12.5" font-weight="700" fill="#58a6ff">dependência de stack</text>
<text class="s dim" x="56" y="114" font-size="11">como veio do sistema de origem</text>
<line x1="56" y1="126" x2="286" y2="126" stroke="#30363d"/>
<g class="m" font-size="11.5">
  <text x="56" y="152" class="sr" style="animation-delay:0s">webhook público, chamado de fora</text>
  <text x="56" y="180" class="sr" style="animation-delay:2s">responde 2xx no payload ignorado</text>
  <text x="56" y="208" class="sr" style="animation-delay:4s">telefone preserva o JID de grupo</text>
  <text x="56" y="236" class="sr" style="animation-delay:6s">coluna de tenancy company_id</text>
  <text x="56" y="264" class="sr" style="animation-delay:8s">resposta no formato success-data</text>
  <text x="56" y="292" class="sr" style="animation-delay:10s">interface em pt-BR</text>
  <text x="56" y="320" class="dim">shadcn/ui + tailwind, hooks da casa</text>
  <text x="56" y="348" class="dim">migrações somente-adição</text>
</g>

<!-- o teste -->
<path d="M306 220 H316" fill="none" stroke="#30363d" stroke-width="1.5" marker-end="url(#e-a)"/>
<rect x="320" y="176" width="196" height="88" rx="10" fill="#161b22" stroke="#30363d" style="animation:testpulse 15s ease-out infinite"/>
<text class="s" x="418" y="202" text-anchor="middle" font-size="12" fill="#e6edf3">se eu trocar isto,</text>
<text class="s" x="418" y="220" text-anchor="middle" font-size="12" fill="#e6edf3">o terceiro para de funcionar?</text>
<text class="m" x="366" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#3fb950">sim</text>
<text class="m" x="470" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#d29922">não</text>

<!-- ramos -->
<path d="M516 200 C560 200 556 150 594 146" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#e-g)" opacity=".75"/>
<path d="M516 244 C560 244 556 300 594 306" fill="none" stroke="#d29922" stroke-width="1.5" marker-end="url(#e-y)" opacity=".75"/>
<g>
  <circle r="4" fill="#3fb950" class="pb" style="animation-delay:0s"><animateMotion dur="15s" repeatCount="indefinite" path="M516 200 C560 200 556 150 594 146" keyPoints="0;0;1;1" keyTimes="0;0.01;0.05;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/></circle>
</g>

<!-- essencial -->
<rect x="598" y="70" width="366" height="150" rx="10" fill="#0f1f16" stroke="#3fb950"/>
<text class="m" x="618" y="96" font-size="12.5" font-weight="700" fill="#3fb950">essencial ao problema</text>
<text class="s" x="944" y="96" text-anchor="end" font-size="11.5" fill="#3fb950">viaja</text>
<text class="s dim" x="618" y="114" font-size="11">vale em qualquer projeto — é exigência do terceiro</text>
<g class="m mut" font-size="11.5">
  <text x="618" y="142" class="ld" style="animation-delay:0.4s">endpoint público, sem sessão</text>
  <text x="618" y="168" class="ld" style="animation-delay:2.4s">2xx em todo caminho do webhook</text>
  <text x="618" y="194" class="ld" style="animation-delay:4.4s">normalização que preserva o grupo</text>
</g>

<!-- parede do stackx -->
<g style="animation:wall 15s ease-in-out infinite">
  <rect x="594" y="240" width="4" height="130" rx="2" fill="#1f6feb"/>
  <text class="m" x="586" y="305" text-anchor="middle" font-size="11" fill="#58a6ff" transform="rotate(-90 586 305)">stackx do destino</text>
</g>

<!-- herdada -->
<rect x="608" y="240" width="356" height="130" rx="10" fill="#1d1a12" stroke="#d29922"/>
<text class="m" x="628" y="266" font-size="12.5" font-weight="700" fill="#d29922">herdada do sistema de origem</text>
<text class="s" x="944" y="266" text-anchor="end" font-size="11.5" fill="#d29922">não viaja</text>
<g class="m" font-size="11.5">
  <g class="ld" style="animation-delay:6.4s"><text x="628" y="294" class="dim">company_id</text><text x="724" y="294" class="dim">→</text><text x="748" y="294" class="mut">o nome de tenancy do destino</text></g>
  <g class="ld" style="animation-delay:8.4s"><text x="628" y="320" class="dim">success-data</text><text x="724" y="320" class="dim">→</text><text x="748" y="320" class="mut">o formato de resposta da casa</text></g>
  <g class="ld" style="animation-delay:10.4s"><text x="628" y="346" class="dim">pt-BR</text><text x="724" y="346" class="dim">→</text><text x="748" y="346" class="mut">o idioma do destino</text></g>
</g>

<text class="s" x="36" y="404" font-size="12.5" fill="#8b949e">Conflito na coluna <tspan fill="#e6edf3">essencial</tspan> é reportado, nunca resolvido: a modulex não escolhe entre a regra de segurança do projeto e a exigência do fornecedor.</text>
<text class="s" x="36" y="424" font-size="12.5" fill="#6e7681">Módulo que não faz essa separação é módulo que injeta convenção alheia — e o modo como isso acontece quase nunca é decisão, é omissão.</text>
</svg>
