<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="O ecossistema Expx: a prodx decide se há trabalho, a sprintx e a runx decidem como, as camadas modificam o comportamento delas, a mergex entrega e a buildx orquestra o projeto inteiro. A modulex é a camada de conhecimento de módulos.">
<title>O ecossistema Expx e o lugar da modulex: uma camada que informa, e cuja ausência nunca bloqueia ninguém</title>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.mut{fill:#8b949e}.dim{fill:#6e7681}.br{fill:#e6edf3}
@keyframes mxglow{0%,100%{opacity:.25}50%{opacity:.7}}
@keyframes cap1{0%,44%{opacity:1}48%,94%{opacity:0}98%,100%{opacity:1}}
@keyframes cap2{0%,46%{opacity:0}50%,92%{opacity:1}96%,100%{opacity:0}}
@keyframes hl{0%{opacity:0}4%{opacity:1}26%{opacity:1}30%,100%{opacity:0}}
.h{opacity:0;animation-name:hl;animation-duration:16s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
</style>
<defs>
  <marker id="x-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#30363d"/></marker>
  <path id="x-m1" d="M854 252 C854 210 300 214 200 186"/>
  <path id="x-m2" d="M854 252 C854 214 560 212 420 186"/>
  <path id="x-m3" d="M854 252 C854 216 700 212 640 186"/>
</defs>

<rect x="0.5" y="0.5" width="999" height="469" rx="16" fill="#0d1117" stroke="#30363d"/>
<text class="s br" x="36" y="38" font-size="15" font-weight="700">A prodx decide <tspan fill="#58a6ff">se</tspan> há trabalho. A sprintx e a runx decidem <tspan fill="#58a6ff">como</tspan>. As camadas mudam o comportamento delas.</text>

<!-- buildx -->
<rect x="36" y="56" width="928" height="46" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="m br" x="56" y="78" font-size="12.5" font-weight="700">buildx</text>
<text class="s mut" x="130" y="78" font-size="12">orquestra um projeto inteiro, da descrição ao sistema pronto — invoca a sprintx uma vez por feature do mapa</text>
<text class="s dim" x="944" y="78" text-anchor="end" font-size="11">acima de todas</text>
<text class="s dim" x="56" y="94" font-size="11">consome a modulex pela sprintx, uma vez por feature que integre um terceiro</text>

<!-- linha principal -->
<g class="m">
  <rect x="36" y="118" width="180" height="68" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="126" y="146" text-anchor="middle" font-size="12.5" font-weight="700" class="br">prodx</text>
  <text x="126" y="166" text-anchor="middle" font-size="10.5" class="dim">decide se há trabalho</text>

  <rect x="256" y="118" width="232" height="68" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="372" y="146" text-anchor="middle" font-size="12.5" font-weight="700" class="br">sprintx &#160;<tspan class="dim" font-weight="400">Build</tspan></text>
  <text x="372" y="166" text-anchor="middle" font-size="10.5" class="dim">feature nova — F1…F6</text>

  <rect x="528" y="118" width="232" height="68" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="644" y="146" text-anchor="middle" font-size="12.5" font-weight="700" class="br">runx &#160;<tspan class="dim" font-weight="400">Run</tspan></text>
  <text x="644" y="166" text-anchor="middle" font-size="10.5" class="dim">ocorrência em produção — E1…E5</text>

  <rect x="800" y="118" width="164" height="68" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="882" y="146" text-anchor="middle" font-size="12.5" font-weight="700" class="br">mergex</text>
  <text x="882" y="166" text-anchor="middle" font-size="10.5" class="dim">branch, PR, pacote de QA</text>
</g>
<g fill="none" stroke="#30363d" stroke-width="1.5" marker-end="url(#x-a)">
  <path d="M216 152 H252"/><path d="M760 152 H796"/>
</g>

<!-- camadas -->
<text class="s dim" x="36" y="218" font-size="11.5">camadas — sozinhas não fazem nada</text>
<g class="m">
  <rect x="36" y="228" width="220" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="146" y="256" text-anchor="middle" font-size="12.5" font-weight="700" class="br">stackx</text>
  <text x="146" y="276" text-anchor="middle" font-size="10.5" class="dim">as convenções do repositório</text>
  <text x="146" y="296" text-anchor="middle" font-size="10.5" fill="#58a6ff">vence a convenção herdada</text>

  <rect x="272" y="228" width="220" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="382" y="256" text-anchor="middle" font-size="12.5" font-weight="700" class="br">legadox</text>
  <text x="382" y="276" text-anchor="middle" font-size="10.5" class="dim">segurança para código legado</text>
  <text x="382" y="296" text-anchor="middle" font-size="10.5" class="dim">na área tocada, o local manda</text>

  <rect x="508" y="228" width="220" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="618" y="256" text-anchor="middle" font-size="12.5" font-weight="700" class="br">memox</text>
  <text x="618" y="276" text-anchor="middle" font-size="10.5" class="dim">a memória do projeto</text>
  <text x="618" y="296" text-anchor="middle" font-size="10.5" class="dim">faz a consulta melhorar</text>

  <rect x="744" y="224" width="220" height="100" rx="10" fill="#1f6feb" opacity=".25" style="animation:mxglow 5s ease-in-out infinite"/>
  <rect x="744" y="228" width="220" height="92" rx="10" fill="#121d2f" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="854" y="256" text-anchor="middle" font-size="12.5" font-weight="700" fill="#58a6ff">modulex</text>
  <text x="854" y="276" text-anchor="middle" font-size="10.5" class="mut">alguém já resolveu isso antes?</text>
  <text x="854" y="296" text-anchor="middle" font-size="10.5" class="dim">M0 … M3</text>
</g>

<!-- injeções -->
<g fill="none" stroke="#1f6feb" stroke-width="1.2" stroke-dasharray="5 4" opacity=".32">
  <use href="#x-m1"/><use href="#x-m2"/><use href="#x-m3"/>
</g>
<g fill="#58a6ff">
  <circle r="3.5"><animateMotion dur="16s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.06;0.2;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"><mpath href="#x-m1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.2;0.21;1" dur="16s" repeatCount="indefinite"/></circle>
  <circle r="3.5"><animateMotion dur="16s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.3;0.44;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"><mpath href="#x-m2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.3;0.44;0.45;1" dur="16s" repeatCount="indefinite"/></circle>
  <circle r="3.5"><animateMotion dur="16s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.56;0.7;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"><mpath href="#x-m3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.56;0.7;0.71;1" dur="16s" repeatCount="indefinite"/></circle>
</g>
<g class="m" font-size="10.5">
  <g class="h" style="animation-delay:2.4s"><rect x="90" y="188" width="72" height="18" rx="9" fill="#0d1117" stroke="#d29922"/><text x="126" y="201" text-anchor="middle" fill="#d29922">SINAL</text></g>
  <g class="h" style="animation-delay:6.2s"><rect x="304" y="188" width="136" height="18" rx="9" fill="#0d1117" stroke="#1f6feb"/><text x="372" y="201" text-anchor="middle" fill="#58a6ff">CINCO AUTORIDADES</text></g>
  <g class="h" style="animation-delay:10.4s"><rect x="596" y="188" width="96" height="18" rx="9" fill="#0d1117" stroke="#f85149"/><text x="644" y="201" text-anchor="middle" fill="#f85149">HIPÓTESE</text></g>
</g>

<!-- expxdev -->
<rect x="36" y="342" width="928" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="m br" x="56" y="364" font-size="12.5" font-weight="700">expxdev</text>
<text class="s mut" x="136" y="364" font-size="12">o CLI que instala, atualiza e diagnostica o ecossistema — e sobe o painel de operação</text>
<text class="m dim" x="944" y="364" text-anchor="end" font-size="11.5">npx expxdev init</text>
<text class="s dim" x="56" y="378" font-size="11">os arquivos de estado das skills carregam frontmatter expx-schema v1, e o painel apenas lê</text>

<g class="s" font-size="13">
  <text x="500" y="424" text-anchor="middle" fill="#8b949e" style="animation:cap1 16s ease-in-out infinite">A ausência de qualquer irmã nunca quebra o fluxo desta skill.</text>
  <text x="500" y="424" text-anchor="middle" fill="#8b949e" opacity="0" style="animation:cap2 16s ease-in-out infinite">E a ausência da <tspan fill="#58a6ff">modulex</tspan> nunca bloqueia nenhuma outra: sem catálogo, a sprintx planeja do zero como sempre planejou.</text>
</g>
<text class="s dim" x="500" y="448" text-anchor="middle" font-size="11.5">insumo que não existe vira aviso do que falta, nunca invenção</text>
</svg>
