<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="O indicador: a leitura cruzada com a escrita. Cada número sozinho mente, e só o cruzamento diz se o ciclo está fechado.">
<title>O indicador da modulex: leitura × escrita, porque cada número sozinho mente</title>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.mut{fill:#8b949e}.dim{fill:#6e7681}.br{fill:#e6edf3}
@keyframes cell{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%,100%{opacity:0}}
@keyframes diag{0%{opacity:0;transform:translateY(6px)}3%{opacity:1;transform:none}22%{opacity:1;transform:none}25%,100%{opacity:0;transform:none}}
@keyframes dot{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%,100%{opacity:0}}
.cl{opacity:0;animation-name:cell;animation-duration:16s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.dg{opacity:0;animation-name:diag;animation-duration:16s;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-iteration-count:infinite}
.dt{opacity:0;animation-name:dot;animation-duration:16s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
</style>

<rect x="0.5" y="0.5" width="999" height="379" rx="16" fill="#0d1117" stroke="#30363d"/>
<text class="s br" x="36" y="38" font-size="15" font-weight="700">Dois números — e cada um sozinho mente</text>
<text class="s dim" x="964" y="38" text-anchor="end" font-size="13">contagem de módulos é vaidade</text>

<!-- eixos -->
<text class="s dim" x="76" y="72" font-size="11.5">escrita — features entregues que viraram módulo &#8594;</text>
<text class="s dim" x="46" y="330" font-size="11.5" transform="rotate(-90 46 330)">leitura — features que consultaram antes &#8594;</text>

<g class="m" font-size="11">
  <text x="176" y="90" text-anchor="middle" class="dim">escrita alta</text>
  <text x="380" y="90" text-anchor="middle" class="dim">escrita zero</text>
  <text x="66" y="166" text-anchor="end" class="dim" transform="rotate(-90 66 166)">leitura alta</text>
  <text x="66" y="290" text-anchor="end" class="dim" transform="rotate(-90 66 290)">leitura zero</text>
</g>

<!-- quadrantes -->
<g>
  <rect x="76" y="100" width="200" height="128" rx="8" fill="#161b22" stroke="#30363d"/>
  <rect x="76" y="100" width="200" height="128" rx="8" fill="#0f1f16" stroke="#3fb950" class="cl" style="animation-delay:0s"/>
  <text class="m" x="176" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#3fb950">ciclo fechado</text>
  <text class="s dim" x="176" y="180" text-anchor="middle" font-size="11">o estado saudável</text>

  <rect x="280" y="100" width="200" height="128" rx="8" fill="#161b22" stroke="#30363d"/>
  <rect x="280" y="100" width="200" height="128" rx="8" fill="#1f1315" stroke="#f85149" class="cl" style="animation-delay:4s"/>
  <text class="m" x="380" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#f85149">o catálogo</text>
  <text class="m" x="380" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#f85149">apodrece</text>

  <rect x="76" y="232" width="200" height="128" rx="8" fill="#161b22" stroke="#30363d"/>
  <rect x="76" y="232" width="200" height="128" rx="8" fill="#1f1315" stroke="#f85149" class="cl" style="animation-delay:8s"/>
  <text class="m" x="176" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#f85149">a consulta está</text>
  <text class="m" x="176" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#f85149">cara demais</text>

  <rect x="280" y="232" width="200" height="128" rx="8" fill="#161b22" stroke="#30363d"/>
  <rect x="280" y="232" width="200" height="128" rx="8" fill="#1d1a12" stroke="#d29922" class="cl" style="animation-delay:12s"/>
  <text class="m" x="380" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#d29922">a skill não pegou</text>
  <text class="s dim" x="380" y="312" text-anchor="middle" font-size="11">o problema é anterior a ela</text>
</g>

<!-- marcador -->
<g>
  <circle cx="98" cy="122" r="6" fill="#e6edf3" class="dt" style="animation-delay:0s"/>
  <circle cx="302" cy="122" r="6" fill="#e6edf3" class="dt" style="animation-delay:4s"/>
  <circle cx="98" cy="254" r="6" fill="#e6edf3" class="dt" style="animation-delay:8s"/>
  <circle cx="302" cy="254" r="6" fill="#e6edf3" class="dt" style="animation-delay:12s"/>
</g>

<!-- leitura -->
<rect x="524" y="100" width="440" height="176" rx="10" fill="#161b22" stroke="#30363d"/>
<g>
  <g class="dg" style="animation-delay:0.3s">
    <text class="m" x="548" y="134" font-size="12.5" font-weight="700" fill="#3fb950">leitura alta &#160;+&#160; escrita alta</text>
    <text class="s mut" x="548" y="162" font-size="12.5">As features consultam antes de planejar, e devolvem</text>
    <text class="s mut" x="548" y="182" font-size="12.5">o que aprenderam. O catálogo cresce com o uso.</text>
    <text class="s dim" x="548" y="212" font-size="12">É o único estado em que a skill se paga.</text>
  </g>
  <g class="dg" style="animation-delay:4.3s">
    <text class="m" x="548" y="134" font-size="12.5" font-weight="700" fill="#f85149">leitura alta &#160;+&#160; escrita zero</text>
    <text class="s mut" x="548" y="162" font-size="12.5">É lido, envelhece, e ninguém devolve o que aprendeu.</text>
    <text class="s mut" x="548" y="182" font-size="12.5">Vira enfeite em seis meses.</text>
    <text class="s dim" x="548" y="212" font-size="12">A M2 é o estágio que falta — e é o que ninguém roda.</text>
  </g>
  <g class="dg" style="animation-delay:8.3s">
    <text class="m" x="548" y="134" font-size="12.5" font-weight="700" fill="#f85149">leitura zero &#160;+&#160; escrita alta</text>
    <text class="s mut" x="548" y="162" font-size="12.5">Alguém se dá ao trabalho de extrair, mas ninguém</text>
    <text class="s mut" x="548" y="182" font-size="12.5">consulta antes de planejar.</text>
    <text class="s dim" x="548" y="212" font-size="12">A M0 encareceu. É o defeito que mata a skill.</text>
  </g>
  <g class="dg" style="animation-delay:12.3s">
    <text class="m" x="548" y="134" font-size="12.5" font-weight="700" fill="#d29922">leitura zero &#160;+&#160; escrita zero</text>
    <text class="s mut" x="548" y="162" font-size="12.5">Ninguém consulta e ninguém devolve.</text>
    <text class="s mut" x="548" y="182" font-size="12.5">Não é a skill que está errada.</text>
    <text class="s dim" x="548" y="212" font-size="12">O problema é anterior a ela.</text>
  </g>
</g>
<line x1="548" y1="232" x2="940" y2="232" stroke="#30363d"/>
<text class="s dim" x="548" y="256" font-size="11.5">o /modulex reporta os dois a partir do INDICE.md e do LACUNAS.md</text>

<text class="s" x="524" y="308" font-size="12" fill="#8b949e">Quarenta módulos que ninguém consulta custam manutenção e não devolvem nada.</text>
<text class="s" x="524" y="330" font-size="12.5" fill="#e6edf3">O que importa é o ciclo — e ciclo tem duas metades.</text>
</svg>
