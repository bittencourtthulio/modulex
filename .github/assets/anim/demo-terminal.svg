<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Demonstração: o usuário descreve o problema, a modulex acha o módulo pronto, injeta só as fatias escolhidas e devolve a feature entregue ao catálogo.">
<title>Demonstração da modulex: da descrição do problema ao módulo injetado, e de volta ao catálogo</title>
<style>
