<defs>
<clipPath id="card"><rect width="1000" height="500" rx="16"/></clipPath>
<clipPath id="typeclip"><rect x="54" y="72" height="26" width="2" style="animation:type 16s steps(51,end) infinite"/></clipPath>
<filter id="blur" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>

<g clip-path="url(#card)">
