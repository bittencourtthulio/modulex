<circle cx="40" cy="483" r="4" fill="#1f6feb"/>
<text x="52" y="487.5" font-size="12"><tspan class="b">modulex</tspan><tspan class="d"> · Claude Code + OpenCode</tspan></text>
<text x="964" y="487.5" font-size="12" text-anchor="end" class="d">catálogo: degrau 2 · offline · 1 arquivo lido</text>

<text x="36" y="90" class="b" font-weight="700">&#10095;</text>
<text x="56" y="90" fill="#e6edf3" clip-path="url(#typeclip)" style="animation:fade 16s linear infinite">Preciso que o sistema atenda cliente pelo WhatsApp.</text>
<g style="animation:cur 16s linear infinite">
  <rect x="57" y="77" width="8" height="17" rx="1" fill="#1f6feb" style="animation:curx 16s steps(51,end) infinite,blink 1s steps(1,end) infinite"/>
</g>

<!-- esqueletos -->
<g style="animation:g1 16s linear infinite"><text x="36" y="168" class="d">M0 CONSULTA</text><text x="206" y="168" class="d">—</text></g>
<g style="animation:g2 16s linear infinite"><text x="36" y="228" class="d">M1 INJEÇÃO</text><text x="206" y="228" class="d">—</text></g>
<g style="animation:g3 16s linear infinite"><text x="36" y="312" class="d">sprintx F1</text><text x="206" y="312" class="d">—</text></g>
<g style="animation:g4 16s linear infinite"><text x="36" y="384" class="d">M2 EXTRAÇÃO</text><text x="206" y="384" class="d">—</text></g>

<!-- linhas -->
<g class="ln" style="animation:l1 16s linear infinite">
  <text x="36" y="126" class="m">modulex · degrau <tspan fill="#e6edf3">2</tspan> · <tspan fill="#e6edf3">.expx/modulex/docs/modulos/</tspan> · atualizado_em <tspan fill="#e6edf3">2026-09-19</tspan></text>
</g>

<g class="ln" style="animation:l2 16s linear infinite">
  <text x="36" y="168" class="t">M0 CONSULTA</text>
  <text x="206" y="168" class="m">lê só <tspan fill="#e6edf3">modulos.json</tspan> — 1 arquivo, sem rede</text>
  <g class="mk" style="animation:m1 16s linear infinite" transform="translate(706,157.5) scale(1.25)"><path d="M0 5 l3.5 3.5 L10 1" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<g class="ln" style="animation:l3 16s linear infinite">
  <text x="206" y="192" class="m"><tspan class="b" font-weight="700">whatsapp-uazapi</tspan> · 6 fatias · verificado_em 2026-08-24</text>
  <g class="mk" style="animation:m2 16s linear infinite" transform="translate(706,181.5) scale(1.25)"><path d="M0 5 l3.5 3.5 L10 1" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>

<g class="ln" style="animation:l4 16s linear infinite">
  <text x="36" y="228" class="t">M1 INJEÇÃO</text>
  <text x="206" y="228" class="m">quais fatias? &#160;<tspan fill="#e6edf3">nucleo</tspan> + <tspan fill="#e6edf3">organizacao</tspan></text>
  <text x="708" y="228" class="y mk" font-size="15" font-weight="700" style="animation:q 16s linear infinite">?</text>
  <g class="mk" style="animation:m3 16s linear infinite" transform="translate(706,217.5) scale(1.25)"><path d="M0 5 l3.5 3.5 L10 1" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<g class="ln" style="animation:l5 16s linear infinite">
  <text x="206" y="252" class="m">base/<tspan fill="#e6edf3">modulo-whatsapp-uazapi.md</tspan> — cada bloco marcado</text>
  <g class="mk" style="animation:m4 16s linear infinite" transform="translate(706,241.5) scale(1.25)"><path d="M0 5 l3.5 3.5 L10 1" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<g class="ln" style="animation:l6 16s linear infinite">
  <text x="206" y="276" font-size="13" class="d">plano → <tspan fill="#8b949e">rascunho</tspan> &#160;·&#160; decisões → <tspan fill="#8b949e">pauta da F2</tspan> &#160;·&#160; artefato → <tspan fill="#8b949e">copiar sob TDD</tspan></text>
</g>

<g class="ln" style="animation:l7 16s linear infinite">
  <text x="36" y="312" class="t">sprintx F1</text>
  <text x="206" y="312" class="m">base de conhecimento pronta — segue para a F2</text>
  <g class="mk" style="animation:m5 16s linear infinite" transform="translate(706,301.5) scale(1.25)"><path d="M0 5 l3.5 3.5 L10 1" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<g class="ln" style="animation:l8 16s linear infinite">
  <text x="36" y="348" class="t">sprintx F6</text>
  <rect x="206" y="337" width="14" height="12" rx="2" fill="#30363d" style="animation:b1 16s linear infinite"/>
  <rect x="224" y="337" width="14" height="12" rx="2" fill="#30363d" style="animation:b2 16s linear infinite"/>
  <rect x="242" y="337" width="14" height="12" rx="2" fill="#30363d" style="animation:b3 16s linear infinite"/>
  <rect x="260" y="337" width="14" height="12" rx="2" fill="#30363d" style="animation:b4 16s linear infinite"/>
  <rect x="278" y="337" width="14" height="12" rx="2" fill="#30363d" style="animation:b5 16s linear infinite"/>
  <rect x="296" y="337" width="14" height="12" rx="2" fill="#30363d" style="animation:b6 16s linear infinite"/>
  <text x="326" y="348" class="m">os 150+ artefatos descem <tspan fill="#e6edf3">só aqui</tspan>, sob TDD</text>
  <g class="mk" style="animation:m6 16s linear infinite" transform="translate(706,337.5) scale(1.25)"><path d="M0 5 l3.5 3.5 L10 1" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>

<g class="ln" style="animation:l9 16s linear infinite">
  <text x="36" y="384" class="t">M2 EXTRAÇÃO</text>
  <text x="206" y="384" class="m">a feature entregue <tspan class="g">volta ao catálogo</tspan> — o ciclo fecha</text>
  <g class="mk" style="animation:m7 16s linear infinite" transform="translate(706,373.5) scale(1.25)"><path d="M0 5 l3.5 3.5 L10 1" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>

<g class="ln" style="animation:l10 16s linear infinite">
  <g filter="url(#blur)" style="opacity:0;animation:glow 16s ease-in-out infinite">
    <g transform="translate(36,415.5) scale(1.5)"><path d="M0 5 l3.5 3.5 L10 1" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="60" y="428" font-size="16" font-weight="700" class="g">a descoberta que não se repete</text>
  </g>
  <g transform="translate(36,415.5) scale(1.5)"><path d="M0 5 l3.5 3.5 L10 1" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="60" y="428" font-size="16" font-weight="700" class="g">a descoberta que não se repete</text>
  <text x="964" y="428" text-anchor="end" font-size="13" class="d">nenhuma pergunta feita duas vezes</text>
</g>

<rect x="0.5" y="0.5" width="999" height="499" rx="16" fill="none" stroke="#30363d"/>
