<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="modulex: a camada de conhecimento de módulos do método Expx. Quatro estágios, da consulta barata à extração que fecha o ciclo.">
<title>modulex — a camada de conhecimento de módulos do método Expx: consultar, injetar, extrair, verificar</title>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.mut{fill:#8b949e}.dim{fill:#6e7681}.br{fill:#e6edf3}
.on-box,.on-ttl,.on-cap,.on-ring{animation-duration:12s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@keyframes hb{0%{opacity:0}1.5%{opacity:1}23%{opacity:1}25%{opacity:0}100%{opacity:0}}
@keyframes ht{0%{fill:#8b949e}1.5%{fill:#58a6ff}23%{fill:#58a6ff}25%{fill:#8b949e}100%{fill:#8b949e}}
@keyframes hc{0%{fill:#6e7681}1.5%{fill:#e6edf3}23%{fill:#e6edf3}25%{fill:#6e7681}100%{fill:#6e7681}}
.on-box{animation-name:hb}.on-ttl{animation-name:ht}.on-cap{animation-name:hc}
.d0{animation-delay:0s}.d1{animation-delay:3s}.d2{animation-delay:6s}.d3{animation-delay:9s}
@keyframes hret{0%{stroke-dashoffset:640;opacity:0}58%{stroke-dashoffset:640;opacity:0}62%{opacity:1}86%{stroke-dashoffset:0;opacity:1}96%{opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes hretxt{0%,62%{opacity:0}68%,96%{opacity:1}100%{opacity:0}}
@keyframes hwash{0%,100%{opacity:.07}50%{opacity:.15}}
</style>
<defs>
  <pattern id="h-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <linearGradient id="h-wash" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="920" y2="340">
    <stop offset="0" stop-color="#1f6feb" stop-opacity="0"/><stop offset=".5" stop-color="#1f6feb" stop-opacity="1"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="h-clip"><rect x="1" y="1" width="998" height="338" rx="15"/></clipPath>
  <marker id="h-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 1 L9 5 L0 9 z" fill="#30363d"/>
  </marker>
</defs>

<rect x="0.5" y="0.5" width="999" height="339" rx="16" fill="#0d1117" stroke="#30363d"/>
<g clip-path="url(#h-clip)">
  <rect width="1000" height="340" fill="url(#h-grid)"/>
  <rect width="1000" height="340" fill="url(#h-wash)" style="animation:hwash 12s ease-in-out infinite"/>
</g>

<text class="m" x="40" y="94" font-size="54" font-weight="700" fill="#e6edf3">module<tspan fill="#58a6ff">x</tspan></text>
<rect x="308" y="63" width="132" height="26" rx="13" fill="none" stroke="#1f6feb"/>
<text class="m" x="374" y="80.5" text-anchor="middle" font-size="13" fill="#58a6ff">método Expx</text>
<text class="s mut" x="40" y="128" font-size="17">O que já foi resolvido volta antes de ser redescoberto</text>

<g>
  <text class="s" x="960" y="80" text-anchor="end" font-size="14" fill="#8b949e">A camada de <tspan fill="#58a6ff" font-weight="600">conhecimento</tspan> do método Expx
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.47;0.5;0.95;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.545;0.9;0.95;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0;0 0;0 0" keyTimes="0;0.5;0.56;0.95;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0 0 1 1" dur="12s" repeatCount="indefinite"/>
    <text class="s" x="960" y="68" text-anchor="end" font-size="14" fill="#e6edf3">O módulo é um problema resolvido,</text>
    <text class="s" x="960" y="88" text-anchor="end" font-size="14" font-weight="600" fill="#58a6ff">não uma biblioteca.</text>
  </g>
</g>

<!-- os quatro estágios -->
<g>
  <g class="m">
    <!-- M0 -->
    <rect x="40" y="176" width="212" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="40" y="176" width="212" height="64" rx="10" fill="#121d2f" stroke="#1f6feb" class="on-box d0" opacity="0"/>
    <text x="146" y="203" text-anchor="middle" font-size="14" font-weight="700" class="mut on-ttl d0">M0 consultar</text>
    <text x="146" y="224" text-anchor="middle" font-size="11.5" class="dim on-cap d0">lê só modulos.json</text>
    <!-- M1 -->
    <rect x="272" y="176" width="212" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="272" y="176" width="212" height="64" rx="10" fill="#121d2f" stroke="#1f6feb" class="on-box d1" opacity="0"/>
    <text x="378" y="203" text-anchor="middle" font-size="14" font-weight="700" class="mut on-ttl d1">M1 injetar</text>
    <text x="378" y="224" text-anchor="middle" font-size="11.5" class="dim on-cap d1">só as fatias escolhidas</text>
    <!-- M2 -->
    <rect x="504" y="176" width="212" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="504" y="176" width="212" height="64" rx="10" fill="#121d2f" stroke="#1f6feb" class="on-box d2" opacity="0"/>
    <text x="610" y="203" text-anchor="middle" font-size="14" font-weight="700" class="mut on-ttl d2">M2 extrair</text>
    <text x="610" y="224" text-anchor="middle" font-size="11.5" class="dim on-cap d2">fecha o ciclo</text>
    <!-- M3 -->
    <rect x="736" y="176" width="224" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="736" y="176" width="224" height="64" rx="10" fill="#121d2f" stroke="#1f6feb" class="on-box d3" opacity="0"/>
    <text x="848" y="203" text-anchor="middle" font-size="14" font-weight="700" class="mut on-ttl d3">M3 verificar</text>
    <text x="848" y="224" text-anchor="middle" font-size="11.5" class="dim on-cap d3">o módulo envelhece</text>
  </g>
  <g stroke="#30363d" stroke-width="1.5" fill="none" marker-end="url(#h-arrow)">
    <path d="M252 208 H268"/><path d="M484 208 H500"/><path d="M716 208 H732"/>
  </g>
</g>

<!-- retorno ao catálogo -->
<path d="M848 240 V272 H146 V244" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="6 5" stroke-dashoffset="640" pathLength="640" style="animation:hret 12s linear infinite" opacity="0"/>
<text class="s" x="500" y="296" text-anchor="middle" font-size="13" fill="#3fb950" opacity="0" style="animation:hretxt 12s ease-in-out infinite">o módulo novo volta ao catálogo — e a próxima consulta já o acha</text>

<text class="m" x="40" y="322" font-size="12" fill="#6e7681">Claude Code &#160;+&#160; OpenCode</text>
<text class="m" x="960" y="322" text-anchor="end" font-size="12" fill="#6e7681">a consulta é barata · só a injeção puxa peso</text>
</svg>
