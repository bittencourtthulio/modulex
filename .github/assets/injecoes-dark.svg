<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="As tres injecoes do modulex: a mesma informacao com autoridade diferente em cada skill">
  <rect width="1000" height="430" rx="14" fill="#0d1117"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">

    <text x="500" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">A mesma informacao, autoridade diferente em cada ponto</text>

    <rect x="392" y="58" width="216" height="66" rx="10" fill="#121d2f" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="500" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#58a6ff">modulex</text>
    <text x="500" y="105" text-anchor="middle" font-size="11.5" fill="#8b949e">catalogo de problemas resolvidos</text>

    <g stroke="#1f6feb" stroke-width="1.5" fill="none" opacity="0.75">
      <path d="M420 124 L168 176"/>
      <path d="M500 124 L500 176"/>
      <path d="M580 124 L832 176"/>
    </g>

    <rect x="40" y="176" width="256" height="212" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="168" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">prodx</text>
    <rect x="112" y="212" width="112" height="22" rx="11" fill="#26190d" stroke="#db6d28" stroke-width="1"/>
    <text x="168" y="227" text-anchor="middle" font-size="10.5" fill="#db6d28">SINAL APENAS</text>
    <g font-size="11.5" fill="#e6edf3">
      <text x="60" y="258">P3  existe modulo pronto?</text>
      <text x="60" y="292">P4  fatias e faixa de esforco</text>
      <text x="60" y="326">P5  modulo_disponivel</text>
    </g>
    <g font-size="10.5" fill="#8b949e">
      <text x="60" y="274">nao e evidencia de que o sistema faz</text>
      <text x="60" y="308">encolhe o escopo minimo</text>
      <text x="60" y="342">contexto, nunca instrucao</text>
    </g>
    <text x="60" y="372" font-size="10.5" fill="#db6d28">modulo pronto = custo menor, nao funcionalidade existente</text>

    <rect x="316" y="176" width="368" height="212" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="500" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">sprintx</text>
    <rect x="422" y="212" width="156" height="22" rx="11" fill="#0f2417" stroke="#3fb950" stroke-width="1"/>
    <text x="500" y="227" text-anchor="middle" font-size="10.5" fill="#3fb950">CINCO AUTORIDADES</text>
    <g font-size="11.5">
      <text x="336" y="258" fill="#e6edf3">F1</text><text x="366" y="258" fill="#8b949e">o MODULO.md das fatias</text><text x="566" y="258" fill="#58a6ff">insumo</text>
      <text x="336" y="284" fill="#e6edf3">F2</text><text x="366" y="284" fill="#8b949e">decisoes ja fechadas</text><text x="566" y="284" fill="#58a6ff">pauta</text>
      <text x="336" y="310" fill="#e6edf3">F3</text><text x="366" y="310" fill="#8b949e">fases e gates do plano</text><text x="566" y="310" fill="#58a6ff">rascunho</text>
      <text x="336" y="336" fill="#e6edf3">F5</text><text x="366" y="336" fill="#8b949e">convencoes e armadilhas</text><text x="566" y="336" fill="#58a6ff">criterio</text>
      <text x="336" y="362" fill="#e6edf3">F6</text><text x="366" y="362" fill="#8b949e">artefatos de producao</text><text x="566" y="362" fill="#58a6ff">copiar, sob TDD</text>
    </g>

    <rect x="704" y="176" width="256" height="212" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="832" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">runx</text>
    <rect x="762" y="212" width="140" height="22" rx="11" fill="#26190d" stroke="#db6d28" stroke-width="1"/>
    <text x="832" y="227" text-anchor="middle" font-size="10.5" fill="#db6d28">HIPOTESE APENAS</text>
    <g font-size="11.5" fill="#e6edf3">
      <text x="724" y="258">E1  cadeia de falha</text>
      <text x="724" y="292">E1  catalogo de erros</text>
    </g>
    <g font-size="10.5" fill="#8b949e">
      <text x="724" y="274">a ordem em que vale olhar</text>
      <text x="724" y="308">codigo de erro nao e causa</text>
    </g>
    <text x="724" y="342" font-size="10.5" fill="#db6d28">a E1 exige prova.</text>
    <text x="724" y="358" font-size="10.5" fill="#db6d28">o plano de fases nao desce.</text>

    <text x="500" y="414" text-anchor="middle" font-size="11" fill="#8b949e">o stackx do projeto de destino tem precedencia sobre a convencao herdada — conflito e reportado, nunca resolvido</text>
  </g>
</svg>
